<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="navyH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A6070"/>
      <stop offset="100%" style="stop-color:#1A2B38"/>
    </linearGradient>
    <linearGradient id="greenH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5ECC62"/>
      <stop offset="100%" style="stop-color:#4CAF50"/>
    </linearGradient>
  </defs>
  
  <!-- Scale icon (left side) -->
  <g transform="translate(30, 20)">
    <!-- Beam -->
    <rect x="20" y="55" width="120" height="10" rx="5" fill="url(#navyH)"/>
    
    <!-- Center -->
    <circle cx="80" cy="60" r="16" fill="url(#greenH)"/>
    <circle cx="80" cy="60" r="9" fill="#fff"/>
    
    <!-- Pillar -->
    <rect x="72" y="70" width="16" height="65" rx="3" fill="url(#navyH)"/>
    
    <!-- Base -->
    <rect x="50" y="135" width="60" height="12" rx="6" fill="url(#navyH)"/>
    <rect x="58" y="147" width="44" height="8" rx="4" fill="#1A2B38"/>
    
    <!-- Left pan -->
    <rect x="28" y="65" width="6" height="25" rx="3" fill="url(#navyH)"/>
    <ellipse cx="31" cy="100" rx="26" ry="7" fill="url(#greenH)"/>
    <path d="M5 100 Q5 125 31 130 Q57 125 57 100" fill="url(#greenH)"/>
    <ellipse cx="31" cy="130" rx="26" ry="7" fill="#43A047"/>
    
    <!-- Right pan -->
    <rect x="126" y="65" width="6" height="25" rx="3" fill="url(#navyH)"/>
    <ellipse cx="129" cy="100" rx="26" ry="7" fill="url(#greenH)"/>
    <path d="M103 100 Q103 125 129 130 Q155 125 155 100" fill="url(#greenH)"/>
    <ellipse cx="129" cy="130" rx="26" ry="7" fill="#43A047"/>
  </g>
  
  <!-- Text: AL-MIZAN -->
  <text x="210" y="115" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="#364150" letter-spacing="4">
    AL-MIZAN
  </text>
  
  <!-- Tagline -->
  <text x="212" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B8090" letter-spacing="3">
    LEGAL CASE MANAGEMENT
  </text>
  
  <!-- Arabic subtitle -->
  <text x="650" y="150" font-family="Arial, sans-serif" font-size="24" fill="#364150" opacity="0.6">
    الميزان
  </text>
  
</svg>
